name: Release

# Declenche par un tag de version : git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write    # creer la release GitHub
  packages: write    # publier l'image sur ghcr.io

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    name: Tests, image, scan, publication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # 1. On ne publie rien qui ne passe pas toute la chaine de qualite.
      - name: mvn verify (tests, couverture, qualite)
        run: mvn -B -ntp verify -Pcoverage,quality

      # 2. Nom d'image en minuscules et etiquettes (v1.0.0, 1.0, latest...).
      - name: Metadonnees de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      # 3. Construction locale (sans publier) pour pouvoir la scanner d'abord.
      - uses: docker/setup-buildx-action@v3
      - name: Construire l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: scan-candidate:latest
          labels: ${{ steps.meta.outputs.labels }}

      # 4. Scan de securite : la release echoue sur une vulnerabilite CRITIQUE corrigeable.
      - name: Scan Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan-candidate:latest
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # 5. Le conteneur doit aussi fonctionner avant publication.
      - name: Test de fumee du conteneur
        run: |
          docker run --rm \
            -v "$PWD/src/test/resources/validation:/project:ro" \
            scan-candidate:latest /project metrics 5

      # 6. Publication de l'image sur ghcr.io.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publier l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # 7. Release GitHub avec le jar executable en piece jointe.
      - name: Creer la release
        uses: softprops/action-gh-release@v2
        with:
          files: target/hai913i-tp1-analyzer.jar
          generate_release_notes: true